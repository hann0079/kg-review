<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>지식그래프 보기 | 프로그래밍 오개념 피드백 시스템 전문가 검토</title>
<style>
  :root {
    --ink: #1b2430; --muted: #5b6673; --line: #d9dee4; --paper: #ffffff; --wash: #f3f5f7;
    --concept: #1f4e79; --mis: #f4d7c3; --mis-line: #b4561c; --judge: #7a3410; --focus: #2f7dd1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--ink); background: var(--paper); font-size: 15px; line-height: 1.6;
    display: flex; flex-direction: column;
  }
  header { padding: 18px 24px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--muted); max-width: 72ch; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--wash); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--concept); color: #fff; }
  input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; width: min(320px, 100%); }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .legend { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 13.5px; margin-left: auto; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--mis); border: 1.5px solid var(--mis-line); }
  .sw.c { border-radius: 4px; background: var(--concept); border-color: var(--concept); width: 18px; }
  .sw.s { border-radius: 4px; background: #eef3f8; border-color: #8fa6bf; width: 22px; }
  .ar { color: var(--concept); font-weight: 700; }
  .legend[hidden] { display: none; }
  aside .lk { font: inherit; border: 0; background: none; padding: 0; color: var(--concept); cursor: pointer; text-decoration: underline; }
  #table h2 { font-size: 16px; margin: 18px 0 8px; }
  #table h2:first-child { margin-top: 0; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #graph { min-height: 520px; height: 100%; }
  aside { border-left: 1px solid var(--line); padding: 18px 20px; overflow-y: auto; }
  aside h2 { font-size: 17px; margin: 0 0 2px; }
  aside .sub { color: var(--muted); margin: 0 0 12px; font-size: 13.5px; }
  aside dl { margin: 0; }
  aside dt { font-weight: 600; font-size: 13.5px; color: var(--muted); margin-top: 12px; }
  aside dd { margin: 2px 0 0; }
  aside ul { margin: 4px 0 0; padding-left: 0; list-style: none; }
  aside li button { font: inherit; text-align: left; border: 0; background: none; padding: 3px 0; color: var(--concept); cursor: pointer; }
  aside li button:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  #table { display: none; padding: 16px 24px 32px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: var(--wash); font-weight: 600; }
  tr.cg td { background: #e8eef5; font-weight: 600; }
  footer { padding: 10px 24px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  body.tableview main { display: none; }
  body.tableview #table { display: block; flex: 1; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .legend { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>지식그래프 보기</h1>
  <p class="lede">평가 문항이 재는 개념 9개와 ‘리스트’, 문항의 오답 선지에 연결된 오개념 45개, 개념 간 선수 관계와 성취기준 대응을 보여 줍니다. 검토지 ‘다. 시스템’의 A1~A6을 평정하실 때 함께 보시면 됩니다.</p>
</header>
<div class="toolbar">
  <div class="seg" role="group" aria-label="회차 고르기">
    <button type="button" data-s="0" aria-pressed="true">전체</button>
    <button type="button" data-s="1" aria-pressed="false">1회차</button>
    <button type="button" data-s="2" aria-pressed="false">2회차</button>
    <button type="button" data-s="3" aria-pressed="false">3회차</button>
  </div>
  <input type="search" id="q" placeholder="오개념 번호나 낱말로 찾기 (예: 27, 또는)" aria-label="찾기">
  <div class="seg" role="group" aria-label="보기 방식">
    <button type="button" id="vg" aria-pressed="true">그래프</button>
    <button type="button" id="vt" aria-pressed="false">표</button>
  </div>
  <div class="seg" role="group" aria-label="그래프 고르기">
    <button type="button" id="vm" aria-pressed="true">오개념 연결</button>
    <button type="button" id="vr" aria-pressed="false">선수 관계·성취기준</button>
  </div>
  <div class="legend" id="legend-mis" aria-hidden="true">
    <span class="key"><span class="sw c"></span>개념</span>
    <span class="key"><span class="sw"></span>오개념(크기: 보고한 문헌 수)</span>
  </div>
  <div class="legend" id="legend-rel" aria-hidden="true" hidden>
    <span class="key"><span class="sw s"></span>성취기준</span>
    <span class="key"><span class="sw c"></span>개념</span>
    <span class="key"><span class="ar">→</span>선수 관계(먼저 알아야 하는 개념 → 다음 개념)</span>
    <span class="key"><span class="ar">⇢</span>회차를 잇는 선수 관계(점선)</span>
  </div>
</div>
<main>
  <div id="graph" role="img" aria-label="개념과 오개념의 연결, 개념 간 선수 관계와 성취기준 그래프. 같은 내용을 표 보기에서 읽을 수 있습니다."></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<section id="table" aria-label="개념과 오개념 표"></section>
<footer>
  개념 정의는 미래엔 중학교 『정보』 교과서의 해당 쪽 문장이며, ‘반복 속의 반복 구조’와 ‘반복 속의 선택 구조’는 교과서 설명을 바탕으로 정리했습니다.
</footer>
<script src="cytoscape.min.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const KG = window.KG;
  // 관련 개념 '리스트': 따로 재는 문항은 없고, 리스트의 데이터 삭제 문항의 선지(오개념-90)로 연결됨
  KG.concepts.splice(1, 0, { id: 'CL', name: '리스트', session: 1, definition: '하나의 이름으로 여러 개의 데이터를 저장할 수 있는 구조를 말한다.', pages: '102쪽, 139쪽', source: '교과서', items: [], related: true });
  // 오개념-101(조건식의 값이 출력된다고 믿음)은 같은 성격의 오개념-52처럼 선택 구조에 연결(선지는 비교 연산 문항에 있음)
  KG.misconceptions.forEach(m => { if (m.no === 90) m.concept = 'CL'; if (m.no === 101) m.concept = 'C6'; });
  // 성취기준 대응(검토지 '가. 평가 문항'과 같음)과 개념 간 선수 관계(같은 회차 안, 회차를 잇는 제어 구조 순서)
  const STD = [
    { id: 'SD5', code: '[9정03-05]', text: '데이터를 순차적으로 저장할 수 있는 구조를 활용하여 문제 해결 프로그램을 작성한다.', concepts: ['C1', 'CL', 'C2'] },
    { id: 'SD6', code: '[9정03-06]', text: '논리 연산과 중첩 제어 구조를 활용하여 문제를 해결하는 프로그램을 작성한다.', concepts: ['C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9'] }
  ];
  const PRE = [
    { id: 'P1', from: 'C1', to: 'CL', session: 1, reason: '리스트의 항목도 값을 저장하는 자리이고, 항목은 번호(변수)로 꺼냅니다. 교과서도 변수와 리스트를 한 절에서 차례로 다룹니다(102쪽).' },
    { id: 'P6', from: 'CL', to: 'C2', session: 1, reason: '항목을 삭제한 뒤 뒤 항목들이 어떻게 움직이는지 알려면 리스트의 항목 번호와 순서를 먼저 알아야 합니다. 교과서도 리스트의 생성·추가 다음에 수정·삭제를 다룹니다(102~103쪽).' },
    { id: 'P2', from: 'C4', to: 'C5', session: 2, reason: "논리 연산 문항은 '그리고'·'또는'의 양쪽에 비교 블록이 들어가므로, 비교 결과(참·거짓)를 알아야 논리 연산의 결과를 구할 수 있습니다(108~109쪽)." },
    { id: 'P3', from: 'C5', to: 'C6', session: 2, reason: "선택 구조는 조건의 참·거짓에 따라 실행할 블록을 고르므로, 비교 연산과 논리 연산으로 조건의 참·거짓을 구하는 방법을 먼저 배웁니다. 교과서도 연산(108~109쪽)을 다룬 뒤 제어 구조(112쪽)를 다룹니다." },
    { id: 'P4', from: 'C7', to: 'C8', session: 3, reason: '안쪽·바깥쪽 반복 모두 반복 구조이므로, 반복 블록의 범위와 횟수를 알아야 중첩 반복의 실행 횟수를 셀 수 있습니다(112~113쪽).' },
    { id: 'P5', from: 'C7', to: 'C9', session: 3, reason: "반복할 때마다 바뀌는 값으로 안쪽의 '만일' 조건을 다시 확인하므로, 반복 구조(범위·값 바꾸기)를 먼저 알아야 합니다(113~114쪽)." },
    { id: 'P7', from: 'C3', to: 'C6', cross: true, reason: "선택 구조 문항은 '만일' 블록의 앞뒤 블록이 위에서부터 차례로 실행되고, 조건에 맞는 쪽의 블록도 차례로 실행되므로 순차 구조를 먼저 알아야 합니다. 교과서도 순차 구조를 프로그램의 가장 기본적인 구조로 설명합니다(교사용 교과서 112쪽)." },
    { id: 'P8', from: 'C6', to: 'C7', cross: true, reason: "제어 구조를 회차 순서대로 배우도록 짰습니다(2회차 선택 구조, 3회차 반복 구조). 반복을 멈추는 조건(‘~이 될 때까지 반복하기’)과 3회차의 반복 속의 선택 구조는 조건 판단을 바탕으로 하므로 선택 구조를 먼저 배웁니다(112~114쪽)." }
  ];
  const sessLabel = p => p.cross ? C[p.from].session + '회차 → ' + C[p.to].session + '회차' : p.session + '회차';
  const C = Object.fromEntries(KG.concepts.map(c => [c.id, c]));
  const M = Object.fromEntries(KG.misconceptions.map(m => [m.id, m]));
  const S = Object.fromEntries(STD.map(s => [s.id, s]));
  const P = Object.fromEntries(PRE.map(p => [p.id, p]));
  const stdOf = id => STD.find(s => s.concepts.includes(id));
  const byConcept = {};
  KG.misconceptions.forEach(m => (byConcept[m.concept] = byConcept[m.concept] || []).push(m));
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const srcText = c => c.source === '교과서' ? '미래엔 교과서 ' + esc(c.pages) : '교과서 ' + esc(c.pages) + ' 설명을 바탕으로 정리';

  // 보기 1: 오개념 연결(회차별 가로줄, 개념 둘레에 오개념)
  const W = 330, H = 285, elsMis = [];
  [1, 2, 3].forEach(k => elsMis.push({ group: 'nodes', data: { id: 'R' + k, label: k + '회차', kind: 's', session: k }, position: { x: -175, y: (k - 1) * H } }));
  const MPOS = { C1: [0, 0], CL: [290, 0], C2: [580, 0], C3: [870, 0], C4: [0, H], C5: [435, H], C6: [870, H], C7: [0, 2 * H], C8: [435, 2 * H], C9: [870, 2 * H] };
  KG.concepts.forEach(c => {
    const [cx, cy0] = MPOS[c.id];
    elsMis.push({ group: 'nodes', data: { id: c.id, label: c.name, kind: 'c', session: c.session, rel: c.related ? 1 : 0 }, position: { x: cx, y: cy0 } });
    const ms = byConcept[c.id] || [];
    const r = ms.length > 4 ? 100 : 82;
    ms.forEach((m, k) => {
      const a = -Math.PI / 2 + (2 * Math.PI * k) / Math.max(ms.length, 1) + (ms.length === 1 ? Math.PI : 0);
      elsMis.push({ group: 'nodes', data: { id: m.id, label: String(m.no), kind: 'm', session: c.session, size: 26 + Math.min(m.freq, 11) * 1.5 },
                    position: { x: cx + r * Math.cos(a), y: cy0 + r * Math.sin(a) } });
      elsMis.push({ group: 'edges', data: { id: c.id + '-' + m.id, source: c.id, target: m.id, session: c.session, kind: 'cm' } });
    });
  });

  // 보기 2: 선수 관계와 성취기준(성취기준 상자 안에 개념, 화살표는 먼저 알아야 하는 개념 → 다음 개념)
  const POS = { C1: [0, 0], CL: [190, 0], C2: [400, 0], C3: [1060, 0], C4: [690, 200], C5: [870, 200], C6: [1060, 200], C7: [690, 440], C8: [960, 390], C9: [960, 500] };
  const elsRel = [];
  [1, 2, 3].forEach(k => elsRel.push({ group: 'nodes', data: { id: 'R' + k, label: k + '회차', kind: 's', session: k }, position: { x: -190, y: [0, 200, 440][k - 1] } }));
  STD.forEach(s => elsRel.push({ group: 'nodes', data: { id: s.id, label: s.code, kind: 'std' } }));
  KG.concepts.forEach(c => elsRel.push({ group: 'nodes', data: { id: c.id, label: c.name, kind: 'c', session: c.session, rel: c.related ? 1 : 0, parent: stdOf(c.id).id }, position: { x: POS[c.id][0], y: POS[c.id][1] } }));
  PRE.forEach(p => elsRel.push({ group: 'edges', data: Object.assign({ id: p.id, source: p.from, target: p.to, kind: 'pre', cross: p.cross ? 1 : 0 }, p.cross ? {} : { session: p.session }) }));

  const cy = cytoscape({
    container: document.getElementById('graph'), elements: elsMis, layout: { name: 'preset', padding: 40 },
    minZoom: 0.3, maxZoom: 2.5, wheelSensitivity: 0.25, autoungrabify: true,
    style: [
      { selector: 'node[kind="c"]', style: { shape: 'round-rectangle', width: 'label', height: 34, padding: '12px', 'background-color': '#1f4e79',
        label: 'data(label)', color: '#fff', 'font-size': 15, 'font-weight': 700, 'text-valign': 'center', 'text-halign': 'center' } },
      { selector: 'node[kind="m"]', style: { width: 'data(size)', height: 'data(size)', 'background-color': '#f4d7c3', 'border-width': 1.5, 'border-color': '#b4561c',
        label: 'data(label)', 'font-size': 12, color: '#4a2410', 'text-valign': 'center', 'text-halign': 'center' } },
      { selector: 'node[kind="s"]', style: { 'background-opacity': 0, label: 'data(label)', color: '#5b6673', 'font-size': 15, 'font-weight': 600, events: 'no' } },
      { selector: 'node[kind="std"]', style: { shape: 'round-rectangle', 'background-color': '#eef3f8', 'border-width': 1.5, 'border-color': '#8fa6bf', padding: '28px',
        label: 'data(label)', 'text-valign': 'top', 'text-halign': 'center', 'text-margin-y': -6, color: '#1f4e79', 'font-size': 15, 'font-weight': 700 } },
      { selector: 'edge', style: { width: 1.2, 'line-color': '#c3cad3', 'curve-style': 'straight' } },
      { selector: 'edge[kind="pre"]', style: { width: 2.5, 'line-color': '#1f4e79', 'target-arrow-color': '#1f4e79', 'target-arrow-shape': 'triangle', 'arrow-scale': 1.3, 'curve-style': 'bezier' } },
      { selector: 'edge[kind="pre"][cross = 1]', style: { 'line-style': 'dashed', 'line-dash-pattern': [8, 5] } },
      { selector: '.dim', style: { opacity: 0.18 } },
      { selector: '.hit', style: { 'overlay-color': '#2f7dd1', 'overlay-opacity': 0.25, 'overlay-padding': 6 } },
      { selector: ':selected', style: { 'overlay-color': '#2f7dd1', 'overlay-opacity': 0.28, 'overlay-padding': 7 } },
      { selector: '.hidden', style: { display: 'none' } }
    ]
  });

  const panel = document.getElementById('panel');
  let mode = 'mis';
  function intro() {
    if (mode === 'mis') {
      panel.innerHTML = `<h2>보는 방법</h2>
        <p>가로줄은 회차입니다. 위에서부터 1회차, 2회차, 3회차입니다.</p>
        <p>남색 상자는 개념이고, 상자 둘레의 원은 그 개념에 연결된 오개념입니다. 원 안의 숫자는 오개념 번호로, 검토지의 ‘오개념-27’ 같은 번호와 같습니다. 원이 클수록 그 오개념을 보고한 선행연구가 많습니다.</p>
        <p>개념이나 오개념을 누르면 이 자리에 자세한 내용이 나옵니다. 빈 곳을 누르면 이 안내로 돌아옵니다. 위의 ‘선수 관계·성취기준’을 누르면 개념끼리의 관계를 볼 수 있습니다.</p>`;
    } else {
      panel.innerHTML = `<h2>보는 방법</h2>
        <p>큰 상자는 성취기준이고, 그 안의 남색 상자는 그 성취기준에 대응하는 개념입니다. 가로줄은 회차입니다.</p>
        <p>화살표는 선수 관계입니다(${PRE.length}개). 실선은 같은 회차 안의 관계로, 화살표가 시작하는 개념을 먼저 알아야 화살표가 가리키는 개념의 문항을 풀 수 있다는 뜻입니다.</p>
        <p>점선은 회차를 잇는 관계로, 제어 구조를 순차 구조, 선택 구조, 반복 구조의 순서로 배운다는 뜻입니다.</p>
        <p>같은 회차 안에서 선수 개념의 문항도 틀리면, 피드백 카드 첫머리에서 선수 개념부터 다시 보도록 안내합니다.</p>
        <p>성취기준, 개념, 화살표를 누르면 이 자리에 내용과 근거가 나옵니다.</p>`;
    }
  }
  function itemsLine(list) { return list.length ? list.map(esc).join(', ') : '없음'; }
  function preLine(list, dir) {
    return list.length ? '<ul>' + list.map(p => { const o = C[dir === 'in' ? p.from : p.to];
      return `<li><button type="button" data-id="${p.id}">${dir === 'in' ? esc(o.name) + ' → 이 개념' : '이 개념 → ' + esc(o.name)}</button></li>`; }).join('') + '</ul>' : '없음';
  }
  function showConcept(c) {
    const ms = byConcept[c.id] || [], s = stdOf(c.id);
    panel.innerHTML = `<h2>${esc(c.name)}</h2><p class="sub">${c.related ? '개념' : '개념 ' + esc(c.id)}, ${c.session}회차</p>
      <dl><dt>개념 정의</dt><dd>${esc(c.definition)}</dd>
      <dt>출처</dt><dd>${srcText(c)}</dd>
      <dt>성취기준</dt><dd><button type="button" data-id="${s.id}" class="lk">${esc(s.code)}</button> ${esc(s.text)}</dd>
      <dt>먼저 알아야 하는 개념</dt><dd>${preLine(PRE.filter(p => p.to === c.id), 'in')}</dd>
      <dt>이 개념을 바탕으로 하는 개념</dt><dd>${preLine(PRE.filter(p => p.from === c.id), 'out')}</dd>
      <dt>재는 문항(기본, 동형 a, 동형 b)</dt><dd>${c.related ? '따로 재는 문항은 없습니다. 리스트의 데이터 삭제 문항(01-04·01-08·01-12)의 선지에 이 개념의 오개념이 연결되어 있습니다.' : c.items.map(esc).join('<br>')}</dd>
      <dt>연결된 오개념 ${ms.length}개</dt><dd><ul>${ms.map(m => `<li><button type="button" data-id="${m.id}">오개념-${m.no} ${esc(m.statement.replace(/^학습자는 /, '').slice(0, 38))}…</button></li>`).join('')}</ul></dd></dl>`;
  }
  function otherUnit(m, c) {
    if (!m.items.length || c.items.some(t => m.items.some(i => t.includes(i)))) return '';
    const o = KG.concepts.find(k => k.items.some(t => m.items.some(i => t.includes(i))));
    return o ? o.name : '';
  }
  function showMis(m) {
    const c = C[m.concept];
    panel.innerHTML = `<h2>오개념-${m.no}</h2><p class="sub">관련 개념: <button type="button" data-id="${c.id}" class="lk">${esc(c.name)}</button></p>
      <p><span class="tag">보고한 문헌 ${m.freq}편</span></p>
      <dl><dt>오개념 진술</dt><dd>${esc(m.statement)}</dd>
      <dt>학생에게 보이는 문장(피드백 카드 첫 문장에 쓰임)</dt><dd>“${esc(m.student)} 생각했나요?”</dd>
      <dt>이 오개념을 고르는 선지가 있는 문항</dt><dd>${itemsLine(m.items)}${otherUnit(m, c) ? `<br><span class="sub">선지는 ‘${esc(otherUnit(m, c))}’ 문항에 있습니다.</span>` : ''}</dd></dl>`;
  }
  function showStd(s) {
    panel.innerHTML = `<h2>${esc(s.code)}</h2><p class="sub">2022 개정 교육과정 중학교 정보 성취기준</p>
      <p>${esc(s.text)}</p>
      <dl><dt>대응하는 개념 ${s.concepts.length}개</dt><dd><ul>${s.concepts.map(id => `<li><button type="button" data-id="${id}">${esc(C[id].name)} (${C[id].session}회차)</button></li>`).join('')}</ul></dd></dl>`;
  }
  function showPre(p) {
    panel.innerHTML = `<h2>${esc(C[p.from].name)} → ${esc(C[p.to].name)}</h2><p class="sub">선수 관계, ${sessLabel(p)}</p>
      <dl><dt>뜻</dt><dd>${p.cross ? `‘${esc(C[p.from].name)}’을(를) 앞 회차에서 먼저 배운 뒤 ‘${esc(C[p.to].name)}’을(를) 배웁니다.` : `‘${esc(C[p.from].name)}’을(를) 먼저 알아야 ‘${esc(C[p.to].name)}’ 문항을 풀 수 있습니다.`}</dd>
      <dt>근거</dt><dd>${esc(p.reason)}</dd>
      <dt>개념</dt><dd><ul><li><button type="button" data-id="${p.from}">${esc(C[p.from].name)}</button></li><li><button type="button" data-id="${p.to}">${esc(C[p.to].name)}</button></li></ul></dd></dl>`;
  }
  function show(id) {
    if (C[id]) showConcept(C[id]); else if (M[id]) showMis(M[id]); else if (S[id]) showStd(S[id]); else if (P[id]) showPre(P[id]);
  }
  panel.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) focusNode(b.dataset.id); });

  function focusNode(id) {
    let n = cy.getElementById(id);
    if (!n.nonempty()) {
      if (M[id] && mode !== 'mis') { setMode('mis'); n = cy.getElementById(id); }
      else if ((S[id] || P[id]) && mode !== 'rel') { setMode('rel'); n = cy.getElementById(id); }
    }
    cy.elements().unselect().removeClass('dim');
    if (n.nonempty()) {
      n.select();
      let hood;
      if (n.isEdge()) hood = n.union(n.connectedNodes());
      else if (n.data('kind') === 'std') hood = n.union(n.children());
      else hood = n.closedNeighborhood().union(n.closedNeighborhood().connectedNodes()).union(n.parent());
      cy.elements().addClass('dim'); hood.removeClass('dim');
      cy.nodes('[kind="s"]').removeClass('dim');
    }
    show(id);
  }
  cy.on('tap', 'node, edge', e => { e.stopPropagation && e.stopPropagation(); focusNode(e.target.id()); });
  cy.on('tap', e => { if (e.target === cy) { cy.elements().removeClass('dim').unselect(); intro(); } });

  let session = 0;
  function applySession() {
    cy.elements().removeClass('hidden dim');
    if (session) cy.elements().filter(el => el.data('session') !== undefined && el.data('session') !== session).addClass('hidden');
    cy.edges().filter(e => e.source().hasClass('hidden') || e.target().hasClass('hidden')).addClass('hidden');
    cy.fit(cy.elements(':visible'), 40);
  }
  function setMode(m) {
    mode = m;
    document.getElementById('vm').setAttribute('aria-pressed', String(m === 'mis'));
    document.getElementById('vr').setAttribute('aria-pressed', String(m === 'rel'));
    document.getElementById('legend-mis').hidden = m !== 'mis';
    document.getElementById('legend-rel').hidden = m !== 'rel';
    cy.elements().remove(); cy.add(m === 'mis' ? elsMis : elsRel);
    if (m === 'rel') cy.nodes('[kind="c"]').forEach(n => n.position({ x: POS[n.id()][0], y: POS[n.id()][1] }));
    showGraph(); applySession(); intro();
  }
  document.getElementById('vm').addEventListener('click', () => setMode('mis'));
  document.getElementById('vr').addEventListener('click', () => setMode('rel'));

  document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
    session = +b.dataset.s;
    document.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applySession(); renderTable();
  }));

  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    const t = q.value.trim(); cy.elements().removeClass('hit');
    if (!t) return;
    const hits = KG.misconceptions.filter(m => String(m.no) === t || m.statement.includes(t) || m.student.includes(t));
    if (hits.length && mode !== 'mis') setMode('mis');
    hits.forEach(m => cy.getElementById(m.id).addClass('hit'));
    KG.concepts.filter(c => c.name.includes(t)).forEach(c => cy.getElementById(c.id).addClass('hit'));
    if (hits.length === 1) focusNode(hits[0].id);
  });

  const table = document.getElementById('table');
  function renderTable() {
    const cs = KG.concepts.filter(c => !session || c.session === session);
    const ps = PRE.filter(p => !session || (p.cross ? C[p.from].session === session || C[p.to].session === session : p.session === session));
    table.innerHTML =
      `<h2>성취기준과 개념</h2><table><thead><tr><th>성취기준</th><th>내용</th><th>대응하는 개념</th></tr></thead><tbody>` +
      STD.map(s => `<tr><td>${esc(s.code)}</td><td>${esc(s.text)}</td><td>${s.concepts.filter(id => !session || C[id].session === session).map(id => esc(C[id].name)).join(', ') || '-'}</td></tr>`).join('') +
      `</tbody></table>` +
      `<h2>개념 간 선수 관계</h2><table><thead><tr><th>먼저 알아야 하는 개념</th><th>다음 개념</th><th>회차</th><th>근거</th></tr></thead><tbody>` +
      (ps.map(p => `<tr><td>${esc(C[p.from].name)}</td><td>${esc(C[p.to].name)}</td><td>${sessLabel(p)}</td><td>${esc(p.reason)}</td></tr>`).join('') || '<tr><td colspan="4">이 회차에는 선수 관계가 없습니다.</td></tr>') +
      `</tbody></table>` +
      `<h2>개념과 오개념</h2><table><thead><tr><th>번호</th><th>오개념 진술</th><th>학생에게 보이는 문장</th><th>문헌 수</th><th>관련 문항</th></tr></thead><tbody>` +
      cs.map(c => `<tr class="cg"><td colspan="5">${esc(c.id)} ${esc(c.name)}: ${esc(c.definition)} (${srcText(c)})</td></tr>` +
        (byConcept[c.id] || []).map(m => `<tr><td>오개념-${m.no}</td><td>${esc(m.statement)}</td><td>${esc(m.student)}</td><td>${m.freq}</td><td>${itemsLine(m.items)}</td></tr>`).join('')).join('') +
      `</tbody></table>`;
  }
  const vg = document.getElementById('vg'), vt = document.getElementById('vt');
  function showGraph() { document.body.classList.remove('tableview'); vg.setAttribute('aria-pressed', 'true'); vt.setAttribute('aria-pressed', 'false'); cy.resize(); cy.fit(cy.elements(':visible'), 40); }
  vg.addEventListener('click', showGraph);
  vt.addEventListener('click', () => { document.body.classList.add('tableview'); vt.setAttribute('aria-pressed', 'true'); vg.setAttribute('aria-pressed', 'false'); });

  intro(); renderTable(); cy.fit(40);
  const h = decodeURIComponent(location.hash.slice(1)); if (h && (C[h] || M[h] || S[h] || P[h])) focusNode(h);
})();
</script>
</body>
</html>
